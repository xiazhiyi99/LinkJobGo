# Isolated API/database; the existing Caddy attaches through its proxy network.
# Requires --env-file .env.autofill-test and -p lingke-autofill-test.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autofill_test
      POSTGRES_PASSWORD: ${AUTOFILL_TEST_DB_PASSWORD:?required}
      POSTGRES_DB: autofill_test
    volumes: [autofill-test-data:/var/lib/postgresql/data]
    networks:
      test-data:
        aliases: [autofill-test-postgres]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U autofill_test -d autofill_test]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 256m
  api:
    image: lingke-autofill-test:${AUTOFILL_TEST_RELEASE:?required}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Dedicated provider configuration only; never load the main site's .env,
    # which also contains its database, session and application settings.
    env_file:
      - .env.autofill-ai
      - .env.autofill-auth
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://autofill_test:${AUTOFILL_TEST_DB_PASSWORD}@autofill-test-postgres:5432/autofill_test
      EMAIL_CODE_SECRET: ${AUTOFILL_TEST_EMAIL_SECRET:?required}
      WEB_ORIGIN: https://linkaigo.com
      APP_URL: https://linkaigo.com/autofill-test
      SESSION_COOKIE_SECURE: 'true'
      SESSION_COOKIE_NAME: lingke_autofill_test
      SESSION_COOKIE_PATH: /autofill-test
      AUTOFILL_EXTENSION_ORIGINS: ${AUTOFILL_EXTENSION_ORIGINS:?required}
      AI_PROVIDER_MODE: http
      MOKA_RULES_MODE: ${MOKA_RULES_MODE:-off}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      test-data:
      proxy:
        aliases: [autofill-test-api]
    mem_limit: 512m
    logging:
      options:
        max-size: 10m
        max-file: '3'
  web:
    image: lingke-autofill-web:${AUTOFILL_TEST_RELEASE:?required}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://linkaigo.com/autofill-test/api
        NEXT_PUBLIC_BASE_PATH: /autofill-test
        NEXT_PUBLIC_SESSION_COOKIE_NAME: lingke_autofill_test
        NEXT_PUBLIC_CAPTCHA_PROVIDER: ${NEXT_PUBLIC_CAPTCHA_PROVIDER:?required}
        NEXT_PUBLIC_ALIYUN_CAPTCHA_REGION: ${NEXT_PUBLIC_ALIYUN_CAPTCHA_REGION:?required}
        NEXT_PUBLIC_ALIYUN_CAPTCHA_PREFIX: ${NEXT_PUBLIC_ALIYUN_CAPTCHA_PREFIX:?required}
        NEXT_PUBLIC_ALIYUN_CAPTCHA_SCENE_ID: ${NEXT_PUBLIC_ALIYUN_CAPTCHA_SCENE_ID:?required}
        EXTENSION_API_ORIGIN: https://linkaigo.com
        EXTENSION_API_PATH_PREFIX: /autofill-test/api
        EXTENSION_LOGIN_URL: https://linkaigo.com/autofill-test/login?next=/workspace/autofill
    restart: unless-stopped
    networks:
      proxy:
        aliases: [autofill-test-web]
    mem_limit: 512m
    logging:
      options:
        max-size: 10m
        max-file: '3'
volumes:
  autofill-test-data:
networks:
  test-data:
    internal: true
  proxy:
    external: true
    name: ${AUTOFILL_TEST_PROXY_NETWORK:-lingke_lingke}
