<!doctype html><html lang="zh"><meta charset="utf-8"><title>重复经历验收</title><style>body{font:16px sans-serif;margin:24px}label{display:inline-block;margin:8px}article{border:1px solid #ddd;margin:12px;padding:8px}dialog{min-width:650px}</style>
<section id="education"><h2>教育经历</h2><div id="education-records"></div><button type="button" id="add-education">添加教育经历</button></section>
<section id="experience"><h2>工作经历</h2><div id="experience-records"></div><button type="button" id="add-experience">添加工作经历</button></section>
<button type="button" id="reorder-education">测试重排</button><button type="button" id="rerender-education">测试重绘</button><button type="submit" id="final-submit">提交申请</button>
<script>
window.fixture={submitted:0,education:[{id:'edu-view-1',school:'',degree:'',startDate:'',endDate:''}],experience:[],failAdd:false};let serial=1;
function renderEducation(){const root=document.querySelector('#education-records');root.replaceChildren();for(const record of fixture.education){const article=document.createElement('article');article.className='record';article.dataset.recordId=record.id;const h=document.createElement('h3');h.textContent='教育记录';article.append(h);for(const[field,label]of Object.entries({school:'学校',degree:'学历',startDate:'开始日期',endDate:'结束日期'})){const l=document.createElement('label');l.textContent=label;const input=document.createElement('input');input.name=field;input.value=record[field];if(field.endsWith('Date'))input.type='month';input.oninput=()=>record[field]=input.value;input.onchange=()=>record[field]=input.value;l.append(input);article.append(l);}root.append(article);}}
function renderExperience(){const root=document.querySelector('#experience-records');root.replaceChildren();for(const record of fixture.experience){const article=document.createElement('article');article.className='record';article.dataset.recordId=record.id;const summary=document.createElement('p');summary.textContent=record.company+' / '+record.title;const edit=document.createElement('button');edit.type='button';edit.textContent='编辑工作经历';edit.onclick=()=>editExperience(record);article.append(summary,edit);root.append(article);}}
function editExperience(record){const dialog=document.createElement('dialog');dialog.setAttribute('aria-label','工作经历');dialog.innerHTML='<h2>工作经历</h2>';for(const[field,label]of Object.entries({company:'公司',title:'职位',startDate:'开始日期',endDate:'结束日期'})){const l=document.createElement('label');l.textContent=label;const input=document.createElement('input');input.name=field;input.value=record[field]??'';if(field.endsWith('Date'))input.type='month';l.append(input);dialog.append(l);}const save=document.createElement('button');save.type='button';save.textContent='保存';save.onclick=()=>{for(const input of dialog.querySelectorAll('input'))record[input.name]=input.value;if(!fixture.experience.includes(record))fixture.experience.push(record);dialog.close();dialog.remove();renderExperience();};const cancel=document.createElement('button');cancel.type='button';cancel.textContent='取消';cancel.onclick=()=>{dialog.close();dialog.remove();};dialog.append(save,cancel);document.body.append(dialog);dialog.showModal();}
document.querySelector('#add-education').onclick=()=>{if(fixture.failAdd)return;setTimeout(()=>{fixture.education.push({id:'edu-view-'+(++serial),school:'',degree:'',startDate:'',endDate:''});renderEducation();},450);};document.querySelector('#reorder-education').onclick=()=>{fixture.education.reverse();const root=document.querySelector('#education-records');for(const node of [...root.children].reverse())root.append(node);};document.querySelector('#rerender-education').onclick=()=>{const old=document.querySelector('#education-records');const fresh=document.createElement('div');fresh.id=old.id;old.replaceWith(fresh);renderEducation();};document.querySelector('#add-experience').onclick=()=>editExperience({id:'experience-view-'+(++serial)});document.querySelector('#final-submit').onclick=()=>fixture.submitted++;window.renderEducation=renderEducation;window.renderExperience=renderExperience;renderEducation();
</script></html>
