<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="popup.css"><title>领客简历填写</title></head>
<body><header><span class="brand">领</span><h1>领客 · 简历填写</h1></header><main><p id="status" role="status" aria-live="polite">正在读取当前页面</p><p id="progress-note" class="muted">自动识别、匹配并填写当前页面</p><progress id="progress" max="100" aria-label="已处理项目进度，不代表填写成功率" hidden></progress><p id="report" hidden></p><div id="report-details"></div>
<details id="fill-options"><summary>填写选项</summary><label class="check"><input id="overwrite-existing" type="checkbox">覆盖页面已有内容（仅本次填写）</label><label class="check" id="college-reset-option" hidden><input id="allow-college-reset" type="checkbox">更换学校时允许清空旧学院</label><p class="muted small">需要覆盖时，请在这里勾选并从本弹窗启动。飞鼠下方的“开始填写”始终保留页面已有内容；不会自动投递。</p></details>
<details id="run-diagnostics" hidden><summary>运行诊断</summary><p class="muted small">本轮耗时和逐字段状态，不包含填写值或凭据。</p><textarea id="run-json" aria-label="运行诊断 JSON" readonly spellcheck="false" rows="12"></textarea></details>
<details id="rule-collection"><summary>规则采集</summary><p class="muted small">只采集当前已展开页面的结构，不填写、不增项、不读取简历，也不请求后端或 AI。未打开的经历和自定义菜单需要展开后再次扫描。</p><button id="collect-page" type="button" disabled>只读扫描</button><p id="collection-status" class="muted small" role="status" aria-live="polite"></p><textarea id="collection-json" aria-label="原始扫描 JSON" readonly spellcheck="false" rows="12" hidden></textarea></details>
<details id="connection-settings"><summary>领客账号</summary><p id="settings-status" role="status" aria-live="polite"></p><p id="settings-metadata" class="muted small">正在读取登录状态</p><form id="settings"><label>邮箱<input id="account-email" type="email" autocomplete="username" required></label><label>密码<input id="account-password" type="password" autocomplete="current-password" required></label><button type="submit">登录</button><button type="button" id="disconnect-settings">退出登录</button></form><p class="muted small">登录失效后请重新登录。密码不保存，页面不接触登录凭据。</p><p class="muted small" id="backend-origin"></p><p class="muted small" id="auth-build"></p></details></main>
<footer><p id="mode-note" class="muted small">保留页面已有内容</p><div class="actions"><button class="primary" data-command="start" disabled>一键填写</button><button data-command="cancel" hidden>停止</button></div><p class="footnote">自动识别 → 匹配资料 → 填写核验</p></footer><script type="module" src="popup.js"></script></body></html>
